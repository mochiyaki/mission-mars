<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Mars</title>
<style>
  :root { --bg:#0b0a0f; --panel:#15121b; --fg:#eae4dc; --muted:#9a8f86; --ok:#5fd68a; --bad:#ff6b5b; --part:#f0c75e; --accent:#ff8c4a; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  #c { position:fixed; inset:0; }
  #hud { position:fixed; top:12px; left:12px; width:330px; max-height:calc(100% - 24px); overflow:auto; background:rgba(21,18,27,.92); border:1px solid #2a2433; border-radius:10px; padding:12px 14px; backdrop-filter:blur(6px); }
  h1 { font-size:16px; margin:0 0 6px; } h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:14px 0 6px; }
  button { background:var(--accent); color:#1a0d05; border:0; border-radius:6px; padding:6px 10px; font-weight:600; cursor:pointer; margin-right:6px; }
  button.sec { background:#2a2433; color:var(--fg); }
  .row { display:flex; gap:6px; align-items:center; margin:4px 0; cursor:pointer; padding:3px 6px; border-radius:6px; }
  .row:hover, .row.sel { background:#241f2e; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .ok{background:var(--ok)} .fail{background:var(--bad)} .partial{background:var(--part)}
  .bar { height:6px; background:#2a2433; border-radius:3px; flex:1; overflow:hidden; } .bar i { display:block; height:100%; background:var(--accent); }
  .muted { color:var(--muted); font-size:12px; }
  #log .row { font-size:12px; cursor:default; } .adopt{color:var(--ok)} .rb{color:var(--bad)}
  #status { position:fixed; right:12px; top:12px; background:rgba(21,18,27,.92); border:1px solid #2a2433; border-radius:10px; padding:10px 14px; min-width:220px; }
  #status b { color:var(--accent); }
  @media (max-width:700px){ #hud{width:calc(100% - 24px); max-height:45%;} #status{display:none;} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h1>🐕 Mars Dog Explorer</h1>
  <div class="muted">Autonomous walk · learns between attempts · adopts only held-out-proven changes</div>
  <div style="margin:10px 0"><button id="playAll">▶ Replay all attempts</button><button class="sec" id="stop">Stop</button></div>
  <h2>Attempts</h2><div id="list"></div>
  <h2>Skill changes (held-out eval)</h2><div id="log"></div>
</div>
<div id="status"><div>Attempt <b id="sAtt">–</b> · skill <b id="sVer">–</b></div><div id="sOut" class="muted">pick an attempt</div><div id="sInfo" class="muted"></div></div>

<div id="err" style="display:none;position:fixed;left:12px;bottom:12px;right:12px;background:#4a1410;color:#ffd9d4;border:1px solid #ff6b5b;border-radius:8px;padding:10px 14px;font:13px monospace;white-space:pre-wrap"></div>
<script>
const showErr = (m)=>{ const e=document.getElementById('err'); e.style.display='block'; e.textContent += m + "\n"; };
window.addEventListener('error', ev=>showErr('Error: '+(ev.message||ev)));
window.addEventListener('unhandledrejection', ev=>showErr('Error: '+(ev.reason&&ev.reason.message||ev.reason)));
</script>
<script type="module">
const sOut0 = document.getElementById('sOut'); sOut0.textContent = 'loading 3D engine…';
let THREE;
for (const url of ['https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js','https://unpkg.com/three@0.160.0/build/three.module.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js']) {
  try { THREE = await import(url); break; } catch (e) { showErr('could not load ' + url); }
}
if (!THREE) throw new Error('Three.js could not be loaded from any CDN — check internet access / firewall.');
sOut0.textContent = 'loading mission data…';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x120a08);
scene.fog = new THREE.Fog(0x120a08, 60, 140);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
camera.position.set(0, 42, 48);
// minimal orbit camera (drag = rotate, wheel = zoom)
const controls = { target:new THREE.Vector3(0,0,0), theta:0.0, phi:0.85, dist:64, update(){
  camera.position.set(this.target.x + this.dist*Math.sin(this.phi)*Math.sin(this.theta), this.target.y + this.dist*Math.cos(this.phi), this.target.z + this.dist*Math.sin(this.phi)*Math.cos(this.theta));
  camera.lookAt(this.target); } };
let drag=null;
canvas.addEventListener('pointerdown', e=>{ drag={x:e.clientX,y:e.clientY}; });
addEventListener('pointerup', ()=>drag=null);
addEventListener('pointermove', e=>{ if(!drag) return; controls.theta -= (e.clientX-drag.x)*0.006; controls.phi = Math.min(1.45, Math.max(0.2, controls.phi - (e.clientY-drag.y)*0.006)); drag={x:e.clientX,y:e.clientY}; });
canvas.addEventListener('wheel', e=>{ controls.dist = Math.min(150, Math.max(10, controls.dist * (1 + e.deltaY*0.001))); }, {passive:true});
scene.add(new THREE.HemisphereLight(0xffd0b0, 0x3a1a10, 0.9));
const sun = new THREE.DirectionalLight(0xffe0c0, 1.6); sun.position.set(40, 60, 20); scene.add(sun);

function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const terrain = await (await fetch('terrain.json')).json();
const N = terrain.n, H = terrain.h, half = N/2;
const hAt = (x,y)=> H[Math.max(0,Math.min(N-1,Math.round(y)))][Math.max(0,Math.min(N-1,Math.round(x)))];
const W = (x,y,h)=> new THREE.Vector3(x-half, (h ?? hAt(x,y)), y-half);

// ---- terrain mesh with mars colours by height + slope
{
  const g = new THREE.PlaneGeometry(N-1, N-1, N-1, N-1); g.rotateX(-Math.PI/2);
  const pos = g.attributes.position, col = new Float32Array(pos.count*3);
  const c = new THREE.Color();
  for (let i=0;i<pos.count;i++){
    const x = i % N, y = Math.floor(i / N);          // PlaneGeometry vertices are row-major, N x N
    const h = H[y][x]; pos.setX(i, x-half); pos.setZ(i, y-half); pos.setY(i, h);
    const sx = (H[y][Math.min(N-1,x+1)]-H[y][Math.max(0,x-1)])/2, sy=(H[Math.min(N-1,y+1)][x]-H[Math.max(0,y-1)][x])/2;
    const s = Math.hypot(sx,sy);
    c.setHSL(0.045 - s*0.03, 0.55, 0.22 + h*0.03 + s*0.12);
    col.set([c.r,c.g,c.b], i*3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col,3)); g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({vertexColors:true, roughness:1, flatShading:true})));
  const sky = new THREE.Mesh(new THREE.SphereGeometry(200,16,8), new THREE.MeshBasicMaterial({color:0x1a0c0a, side:THREE.BackSide})); scene.add(sky);
}
// ---- base (lander) and targets (beacons)
{
  const b = W(terrain.base[0], terrain.base[1]);
  const lander = new THREE.Group();
  lander.add(new THREE.Mesh(new THREE.CylinderGeometry(1.6,2,1.2,8), new THREE.MeshStandardMaterial({color:0xcfd4dc, metalness:.6, roughness:.4})));
  const cone = new THREE.Mesh(new THREE.ConeGeometry(1.4,2.6,8), new THREE.MeshStandardMaterial({color:0xe8ecf2, metalness:.5, roughness:.4})); cone.position.y=1.9; lander.add(cone);
  for (let i=0;i<3;i++){ const leg=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,2.4), new THREE.MeshStandardMaterial({color:0x888})); const a=i*2.09; leg.position.set(Math.cos(a)*1.8,-0.8,Math.sin(a)*1.8); leg.rotation.z=Math.cos(a)*.5; leg.rotation.x=-Math.sin(a)*.5; lander.add(leg); }
  lander.position.copy(b).add(new THREE.Vector3(0,1.4,0)); scene.add(lander);
  const glow = new THREE.PointLight(0x9ad7ff, 8, 14); glow.position.copy(b).add(new THREE.Vector3(0,3,0)); scene.add(glow);
  for (const t of terrain.targets){
    const p = W(t[0],t[1]);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,3), new THREE.MeshStandardMaterial({color:0xdddddd})); pole.position.copy(p).add(new THREE.Vector3(0,1.5,0)); scene.add(pole);
    const orb = new THREE.Mesh(new THREE.SphereGeometry(.4,12,12), new THREE.MeshStandardMaterial({color:0x5fd68a, emissive:0x2fb86a, emissiveIntensity:1.2})); orb.position.copy(p).add(new THREE.Vector3(0,3.2,0)); scene.add(orb);
  }
}
// ---- the dog
const dog = new THREE.Group();
const bodyMat = new THREE.MeshStandardMaterial({color:0xf2b233, metalness:.3, roughness:.5});
const body = new THREE.Mesh(new THREE.BoxGeometry(1.4,.5,.6), bodyMat); body.position.y=.75; dog.add(body);
const head = new THREE.Mesh(new THREE.BoxGeometry(.45,.4,.45), new THREE.MeshStandardMaterial({color:0x333})); head.position.set(.85,.95,0); dog.add(head);
const legs = [];
for (const [lx,lz] of [[.5,.25],[.5,-.25],[-.5,.25],[-.5,-.25]]){ const l=new THREE.Mesh(new THREE.BoxGeometry(.14,.7,.14), new THREE.MeshStandardMaterial({color:0x444})); l.position.set(lx,.35,lz); dog.add(l); legs.push(l); }
const lamp = new THREE.PointLight(0xffd8a0, 3, 8); lamp.position.set(.9,1,0); dog.add(lamp);
dog.visible=false; scene.add(dog);

// ---- data
const index = await (await fetch('attempts/index.json')).json();
let log = []; try { log = await (await fetch('skills/log.json')).json(); } catch (e) {}
const maxScore = Math.max(...index.map(a=>a.score), 1);
const listEl = document.getElementById('list');
index.forEach(a=>{
  const r=document.createElement('div'); r.className='row'; r.id='att'+a.attempt;
  r.innerHTML=`<span class="dot ${a.outcome==='success'?'ok':a.outcome}"></span><span style="width:28px">#${a.attempt}</span><span class="muted" style="width:34px">v${a.skill_version}</span><span class="bar"><i style="width:${a.score/maxScore*100}%"></i></span><span style="width:40px;text-align:right">${a.score}</span>`;
  r.onclick=()=>{ stopAll(); play(a.attempt); };
  listEl.appendChild(r);
});
document.getElementById('log').innerHTML = log.map(e=>`<div class="row"><span class="${e.decision==='ADOPTED'?'adopt':'rb'}">${e.decision==='ADOPTED'?'✔':'✖'}</span><span>after #${e.after_attempt}: ${e.change} <span class="muted">(${e.heldout_current} → ${e.heldout_candidate})</span></span></div>`).join('') || '<div class="muted">no changes yet</div>';

// ---- replay
let routeLines = [], markers = [], anim = null, queue = [];
function clearRoute(){ for (const o of [...routeLines,...markers]) scene.remove(o); routeLines=[]; markers=[]; }
async function play(n){
  clearRoute();
  document.querySelectorAll('.row.sel').forEach(e=>e.classList.remove('sel'));
  document.getElementById('att'+n)?.classList.add('sel');
  const a = await (await fetch(`attempts/attempt_${String(n).padStart(3,'0')}.json`)).json();
  document.getElementById('sAtt').textContent='#'+a.attempt; document.getElementById('sVer').textContent='v'+a.skill_version;
  const so=document.getElementById('sOut'); so.textContent=a.outcome.toUpperCase()+' — '+a.reason; so.style.color = a.outcome==='success'?'var(--ok)':a.outcome==='partial'?'var(--part)':'var(--bad)';
  document.getElementById('sInfo').textContent=`max_slope ${a.skill.max_slope} · slope_weight ${a.skill.slope_weight} · reserve ${a.skill.energy_reserve}% · score ${a.score}`;
  const pts = a.path.map(p=>W(p[0],p[1],p[2]+0.25));
  const color = a.outcome==='success'?0x5fd68a:a.outcome==='partial'?0xf0c75e:0xff6b5b;
  const geo = new THREE.BufferGeometry().setFromPoints(pts); geo.setDrawRange(0,0);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({color, linewidth:2})); scene.add(line); routeLines.push(line);
  dog.visible=true;
  const events = a.events.filter(e=>e.type==='fall'||e.type==='stuck_in_sand');
  const stepsPerSec = 28; let t=0, last=performance.now();
  return new Promise(res=>{
    anim = (now)=>{
      t += (now-last)/1000*stepsPerSec; last=now;
      const i = Math.min(Math.floor(t), pts.length-1), f = t-Math.floor(t);
      const p = pts[i].clone(); if (i<pts.length-1) p.lerp(pts[i+1], f);
      dog.position.copy(p); if (i<pts.length-1){ const d=pts[i+1].clone().sub(pts[i]); if(d.lengthSq()>0) dog.rotation.y=Math.atan2(-d.z,d.x); }
      legs.forEach((l,k)=> l.rotation.z = Math.sin(t*6 + (k%2?Math.PI:0))*.5);
      geo.setDrawRange(0, i+2);
      for (const e of events){ if (!e.shown && e.step <= i){ e.shown=true; const m=new THREE.Mesh(new THREE.SphereGeometry(.5,10,10), new THREE.MeshBasicMaterial({color:e.type==='fall'?0xff3b2f:0xd9a441, transparent:true, opacity:.85})); m.position.copy(W(e.pos[0],e.pos[1])).add(new THREE.Vector3(0,.6,0)); scene.add(m); markers.push(m); } }
      controls.target.lerp(p, .05);
      if (i>=pts.length-1){ anim=null; if (a.outcome==='fail') body.rotation.z=1.2; else body.rotation.z=0; setTimeout(res, 700); } else body.rotation.z=0;
    };
  });
}
async function playAll(){ queue = index.map(a=>a.attempt); while(queue.length){ await play(queue.shift()); } }
function stopAll(){ queue=[]; anim=null; }
document.getElementById('playAll').onclick=()=>{ stopAll(); playAll(); };
document.getElementById('stop').onclick=stopAll;

renderer.setAnimationLoop((now)=>{ if (anim) anim(now); controls.update(); renderer.render(scene,camera); });
sOut0.textContent = 'ready — click an attempt or Replay all';
if (index.length) play(index[index.length-1].attempt);
</script>
</body>
</html>
